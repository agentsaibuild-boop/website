name: Deploy to SuperHosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to SuperHosting via SFTP
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: 22
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          localDir: './dist'
          remoteDir: '/public_html'
          deleteRemote: false
          onlyIncluded: true

      - name: Deployment Status
        if: success()
        run: echo "✅ Deployment successful! Site updated at ${{ secrets.SITE_URL }}"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment failed. Check SFTP credentials."
